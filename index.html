<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamaghorrible</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="info">
      <section class="timename">
        <time id="clock">0:00</time>
        <p>-</p>
        <p id="tama-display-name">Name</p>
      </section>
    <section class="health">
    <div class="health-bar">
        <div id="health-fill"></div>
    </div>

    <img class="heart-icon" src="assets/heart.png">
</section>
    </header>

    <main class="game">
      <div id="tama" class="tama Idle" role="img"></div>

      <ul class="invbar" id="inventory">
    <li class="border-inv">
        <button type="button" data-action="food">
            <img class="invpic" src="assets/Feed.png" width="64" height="64">
        </button>
    </li>
    <li class="border-inv">
        <button type="button" data-action="medicine">
            <img class="invpic" src="assets/pills.png" width="64" height="64">
        </button>
    </li>

    <li class="border-inv">
        <button type="button" data-action="wash">
            <img class="invpic" src="assets/soap-icon.png" width="64" height="64">
        </button>
    </li>

    <li class="border-inv">
        <button type="button" data-action="hit">
            <img class="invpic" src="assets/hand.png" width="64" height="64">
        </button>
    </li>

    <li class="border-inv">
        <button type="button" data-action="phone">
            <img class="invpic" src="assets/phone.png" width="64" height="64">
        </button>
    </li>

    <li class="border-inv">
        <button type="button" data-action="sleep">
            <img class="invpic" src="assets/moon.png" width="64" height="64">
        </button>
    </li>

</ul>
      </ul>
    </main>

    <dialog id="name-modal">
      <form id="name-form">
        <label for="tama-name">Nomme ton Atrocité</label> <br />
        <input
          type="text"
          id="tama-name"
          maxlength="12"
          required
          autocomplete="off"
        />
        <br />
        <button type="submit">Confirmer</button>
      </form>
    </dialog>

    <dialog id="death-modal">
        <p id="death-message">Ton Atrocité n'est plus...</p>
        <br />
        <button type="button" id="reset-button">Recommencer</button>
    </dialog>

    <script type="module" src="start_game.js"></script>
  </body>
</html>
