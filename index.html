<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamaghorrible</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="info">
        <section class="timename">
            <time id="clock">22:32</time>
            <p>Name</p>
        </section>
        <section class="health">
            <div class="health-bar" min="0" max="10" value="10"></div>
            <img class="heart-icon" src="assets/heart.png" alt="Points de vie">
        </section>
    </header>

    <main class="game">
        <div class="tama Idle" role="img" aria-label="Tamagotchi qui dort"></div>

        <ul class="invbar">
            <li class="border-inv">
                <button type="button" data-action="feed">
                    <img class="invpic" src="assets/Feed.png" alt="Nourrir" width="64" height="64">
                </button>
            </li>
            <li class="border-inv">
                <button type="button" data-action="medicine">
                    <img class="invpic" src="assets/pills.png" alt="Médicaments" width="64" height="64">
                </button>
            </li>
            <li class="border-inv">
                <button type="button" data-action="wash">
                    <img class="invpic" src="assets/soap-icon.png" alt="Laver" width="64" height="64">
                </button>
            </li>
            <li class="border-inv">
                <button type="button" data-action="pet">
                    <img class="invpic" src="assets/hand.png" alt="Caresser" width="64" height="64">
                </button>
            </li>
            <li class="border-inv">
                <button type="button" data-action="call">
                    <img class="invpic" src="assets/phone.png" alt="Appeler" width="64" height="64">
                </button>
            </li>
            <li class="border-inv">
                <button type="button" data-action="sleep">
                    <img class="invpic" src="assets/moon.png" alt="Dormir" width="64" height="64">
                </button>
            </li>
        </ul>
    </main>

    <script src="js.js"></script>
</body>
</html>
